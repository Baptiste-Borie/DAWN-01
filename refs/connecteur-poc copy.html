<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAWN — connecteur CSS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --stop-casing-0: #beb79e;
        --stop-casing-1: #b1aa90;
        --stop-casing-2: #a09a7e;
        --stop-casing-3: #8b846b;
        --stop-bezel-0: #453f34;
        --stop-bezel-1: #211d16;
        --stop-bezel-2: #1b1712;
        --stop-bezel-3: #141009;
        --stop-key-0: #b7b3a0;
        --stop-key-1: #a5a18d;
        --stop-lcd-dark-0: #1c1a15;
        --stop-lcd-dark-1: #2e2b23;
        --color-ink: #33312a;
        --color-ink-faint: #514e3b;
        --color-on-lcd-dark: #d7d3c6;
        --color-on-chan: #8f8b7c;
        --color-crt: #39ff14;
        --color-burnt: #c94e1e;
        --color-led-core: #f2ffc4;
        --color-led: #b3e94e;
        --color-led-rim: #558f18;
        /* laiton des contacts */
        --brass-hi: #e8c878;
        --brass: #c9a35a;
        --brass-lo: #8a6f34;
        --brass-shadow: #4a3a15;
        --radius-sm: 7px;
        --radius-md: 9px;
        --radius-lg: 13px;
        --radius-xl: 26px;
        --sh-hollow-top-deep: inset 0 3px 6px rgb(0 0 0/0.7);
        --sh-bevel-top: inset 0 2px 2px rgb(255 255 255/0.45);
        --sh-glow-led: 0 0 10px rgb(170 235 80/0.85);

        /* Or / contacts */
        --gold-hi: #e8c878;
        --gold: #c9a35a;
        --gold-mid: #a9823e;
        --gold-low: #7a5a24;
        --gold-shadow: #4a3514;

        /* PCB vert */
        --pcb-hi: #4f7b55;
        --pcb: #315e3c;
        --pcb-low: #1f432b;
        --pcb-edge: #122a1a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background: #26241f;
        font-family: "Space Grotesk", sans-serif;
        color: var(--color-ink);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px;
        gap: 18px;
      }
      .hint {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: #b8b09a;
        letter-spacing: 1px;
      }
      .toggle {
        border: 0;
        cursor: pointer;
        font: inherit;
        padding: 9px 20px;
        border-radius: var(--radius-md);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #2e2c24;
        background: linear-gradient(var(--stop-key-0), var(--stop-key-1));
        box-shadow:
          0 0 0 1px rgb(50 45 35/0.3),
          -3px 4px 3px rgb(0 0 0/0.4),
          inset 0 2px 2px rgb(255 255 255/0.45),
          inset 0 -5px 7px rgb(0 0 0/0.22);
      }

      .rig {
        display: flex;
        align-items: center;
        position: relative;
      }

      /* ---- HOME (fragment de flanc droit) ---- */
      .home-edge {
        width: 500px;
        height: 500px;
        border-radius: var(--radius-xl);
        position: relative;
        background: radial-gradient(
          125% 105% at 30% 0%,
          var(--stop-casing-0),
          var(--stop-casing-1) 50%,
          var(--stop-casing-2) 78%,
          var(--stop-casing-3)
        );
        box-shadow: 0 20px 46px rgb(0 0 0/0.5);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 20px;
      }
      .home-label {
        position: absolute;
        top: 18px;
        left: 22px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: var(--color-ink-faint);
      }

      /* ====== LE PORT FEMELLE ======
         Trois couches physiques :
         arrière z1 / PCB du module z2 / façade z3
      ======================================= */
      .port {
        position: absolute;
        top: 4%;
        right: -30px;
        width: 62px;
        height: 92%;
        pointer-events: none;
      }

      /* Partie située derrière la barrette. */
      .port-back {
        position: absolute;
        inset: 0 0 0 auto;
        z-index: 1;
        width: 30px;
        border-radius: 0 5px 5px 0;
        background: linear-gradient(
          90deg,
          #18191d 0 28%,
          #292a2f 28% 72%,
          #5b5c63 72% 100%
        );
        box-shadow:
          5px 5px 8px rgb(0 0 0 / 0.38),
          inset -2px 0 2px rgb(255 255 255 / 0.08);
      }

      /* Fond sombre de la fente, visible lorsque le module est retiré. */
      .port-back::before {
        content: "";
        position: absolute;
        top: 18px;
        bottom: 18px;
        left: 2px;
        width: 15px;
        border-radius: 3px;
        background: linear-gradient(90deg, #08090b, #17181c);
        box-shadow:
          inset 4px 0 5px rgb(0 0 0 / 0.9),
          inset -1px 0 rgb(255 255 255 / 0.06);
      }

      /* Contacts internes : derrière le PCB, donc partiellement masqués branché. */
      .port-contacts {
        position: absolute;
        z-index: 2;
        top: 28px;
        bottom: 28px;
        left: 5px;
        width: 7px;
        opacity: 0.9;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0 2px,
          var(--gold-hi) 2px 3px,
          var(--gold) 3px 6px,
          var(--gold-low) 6px 7px,
          transparent 7px 10px
        );
        filter: drop-shadow(-1px 0 0 var(--gold-shadow));
      }

      /* Partie située devant la barrette. */
      .port-front {
        position: absolute;
        inset: 0 auto 0 0;
        z-index: 3;
        width: 39px;
        border-radius: 7px 2px 2px 7px;
        background:
          repeating-linear-gradient(
            to bottom,
            transparent 0 30px,
            rgb(255 255 255 / 0.055) 30px 31px,
            transparent 31px 61px
          ),
          linear-gradient(
            90deg,
            #25262a 0 62%,
            #3d3e44 62% 84%,
            #56575e 84% 100%
          );
        box-shadow:
          inset 2px 0 2px rgb(255 255 255 / 0.08),
          inset -2px 0 2px rgb(0 0 0 / 0.34),
          2px 4px 6px rgb(0 0 0 / 0.28);
      }

      /* Fine lèvre qui recouvre visuellement le bord du PCB. */
      .port-front::after {
        content: "";
        position: absolute;
        top: 17px;
        right: -4px;
        bottom: 17px;
        width: 7px;
        border-radius: 2px;
        background: linear-gradient(90deg, #28292e, #56575d);
        box-shadow:
          -2px 0 2px rgb(0 0 0 / 0.32),
          inset 1px 0 rgb(255 255 255 / 0.08);
      }

      .port-code {
        position: absolute;
        top: 18px;
        left: 10px;
        color: rgb(218 218 211 / 0.64);
        font:
          700 7px "IBM Plex Mono",
          monospace;
        letter-spacing: 0.8px;
        writing-mode: vertical-rl;
      }

      .port-revision {
        position: absolute;
        bottom: 18px;
        left: 10px;
        color: rgb(218 218 211 / 0.43);
        font:
          700 6px "IBM Plex Mono",
          monospace;
        letter-spacing: 0.7px;
        writing-mode: vertical-rl;
      }

      .port-mark {
        position: absolute;
        top: 50%;
        left: 17px;
        color: rgb(218 218 211 / 0.5);
        font:
          700 7px "IBM Plex Mono",
          monospace;
        letter-spacing: 1px;
        white-space: nowrap;
        transform: translate(-50%, -50%) rotate(-90deg);
      }

      .port-rivet {
        position: absolute;
        left: 16px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #15161a;
        box-shadow:
          0 0 0 1px #7e6735,
          inset 1px 1px 2px rgb(0 0 0 / 0.8);
      }

      .port-rivet-top {
        top: 64px;
      }

      .port-rivet-bottom {
        bottom: 64px;
      }

      /* Clip supérieur : levier fin, asymétrique et mécanique. */
      .ram-clip {
        position: absolute;
        top: -24px;
        right: 1px;
        z-index: 4;
        width: 34px;
        height: 42px;
        transform-origin: 17px 36px;
        transform: rotate(-18deg);
        transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Bras principal du levier. */
      .ram-clip::before {
        content: "";
        position: absolute;
        left: 11px;
        bottom: 4px;
        width: 11px;
        height: 34px;
        border-radius: 3px 3px 5px 5px;
        background: linear-gradient(
          90deg,
          #202126 0 24%,
          #35363c 24% 72%,
          #55565d 72% 100%
        );
        clip-path: polygon(18% 100%, 0 22%, 18% 4%, 76% 0, 100% 18%, 82% 100%);
        box-shadow:
          2px 3px 4px rgb(0 0 0 / 0.38),
          inset 1px 0 rgb(255 255 255 / 0.08);
      }

      /* Pivot visible. */
      .ram-clip::after {
        content: "";
        position: absolute;
        left: 13px;
        bottom: 0;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 38% 34%,
          #73747b 0 18%,
          #3a3b40 22% 56%,
          #16171a 60% 100%
        );
        box-shadow:
          0 0 0 1px #17181b,
          0 2px 3px rgb(0 0 0 / 0.45);
      }

      /* Petite tête de verrouillage, volontairement asymétrique. */
      .ram-clip span {
        position: absolute;
        top: 0;
        left: 5px;
        width: 27px;
        height: 11px;
        border-radius: 4px 3px 2px 2px;
        background: linear-gradient(
          180deg,
          #65666e 0,
          #47484f 38%,
          #292a2f 100%
        );
        clip-path: polygon(0 18%, 72% 0, 100% 28%, 94% 100%, 18% 100%, 0 72%);
        box-shadow:
          inset 0 2px 1px rgb(255 255 255 / 0.11),
          1px 3px 4px rgb(0 0 0 / 0.38);
      }

      /* Petite encoche de prise sur la tête. */
      .ram-clip span::after {
        content: "";
        position: absolute;
        top: 3px;
        right: 4px;
        width: 7px;
        height: 3px;
        border-radius: 2px;
        background: #1f2024;
        box-shadow: inset 0 1px 1px rgb(0 0 0 / 0.8);
      }

      .rig.on .ram-clip {
        transform: rotate(0deg);
        transition-delay: 0.46s;
      }

      .rig:not(.on) .ram-clip {
        transition-delay: 0s;
      }

      /* ---- MODULE + languette mâle ---- */
      .module {
        position: relative;
        z-index: 2;
        width: 500px;
        height: 500px;
        border-radius: var(--radius-lg);
        background: radial-gradient(
          120% 105% at 60% 0%,
          var(--stop-casing-1),
          var(--stop-casing-3)
        );
        box-shadow: 0 20px 46px rgb(0 0 0/0.55);
        display: flex;
        align-items: center;
        padding: 18px 18px 18px 30px;
        margin-left: -6px;
        transition: transform 0.5s cubic-bezier(0.5, 0, 0.2, 1);
      }
      /*
       * Position fermée : le connecteur mâle de 62 px se place exactement
       * entre les deux lèvres du port. Le corps beige du module reste à droite.
       */
      .rig.on .module {
        transform: translateX(38px);
      }

      .rig:not(.on) .module {
        transform: translateX(120px);
      }

      /* ===== CONNECTEUR EDGE INSPIRÉ RAM ===== */
      .plug {
        --pin-h: 4px;
        --pin-gap: 2px;

        position: absolute;
        top: 5%;
        left: -62px;
        width: 62px;
        height: 90%;
        overflow: hidden;
        border-radius: 4px 0 0 4px;
        border: 1px solid var(--pcb-edge);
        border-right: 0;
        background:
          radial-gradient(
            circle at 80% 12%,
            rgb(255 255 255 / 0.08),
            transparent 22%
          ),
          linear-gradient(90deg, var(--pcb-hi), var(--pcb) 52%, var(--pcb-low));
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.12),
          inset 0 -3px 5px rgb(0 0 0 / 0.28),
          -4px 6px 8px rgb(0 0 0 / 0.34);
      }

      .plug::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 31px;
        background: linear-gradient(
          90deg,
          #0d1d13,
          var(--pcb-edge) 28%,
          var(--pcb-low)
        );
        box-shadow:
          inset -1px 0 0 rgb(255 255 255 / 0.05),
          2px 0 4px rgb(0 0 0 / 0.2);
      }

      .plug::after {
        content: "J1";
        position: absolute;
        top: 12px;
        right: 5px;
        color: rgb(213 214 202 / 0.72);
        font:
          700 7px "IBM Plex Mono",
          monospace;
        letter-spacing: 0.8px;
        transform: rotate(90deg);
      }

      .plug-inner {
        position: absolute;
        inset: 28px auto 28px 4px;
        z-index: 2;
        width: 22px;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0 var(--pin-gap),
          var(--gold-hi) var(--pin-gap) calc(var(--pin-gap) + 1px),
          var(--gold) calc(var(--pin-gap) + 1px)
            calc(var(--pin-gap) + var(--pin-h) - 1px),
          var(--gold-low) calc(var(--pin-gap) + var(--pin-h) - 1px)
            calc(var(--pin-gap) + var(--pin-h)),
          transparent calc(var(--pin-gap) + var(--pin-h))
            calc(var(--pin-gap) + var(--pin-h) + var(--pin-gap))
        );
        filter: drop-shadow(0 1px 0 var(--gold-shadow));
      }

      .plug-traces {
        position: absolute;
        z-index: 1;
        top: 28px;
        bottom: 28px;
        left: 25px;
        width: 27px;
        opacity: 0.6;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0 2px,
          #c0b27f 2px 3px,
          transparent 3px 6px
        );
        mask-image: linear-gradient(90deg, #000, transparent 95%);
      }

      .circle-hole {
        position: absolute;
        z-index: 4;
        top: 10px;
        left: 7px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #26241f;
        box-shadow:
          0 0 0 1px var(--gold-low),
          inset 1px 1px 3px rgb(0 0 0 / 0.65);
      }

      .pin-hole {
        position: absolute;
        z-index: 5;
        top: 40%;
        left: -10px;
        width: 22px;
        height: 22px;
        transform: translateY(-50%);
        border-radius: 50%;
        background: #26241f;
        box-shadow:
          0 0 0 1px var(--gold-low),
          inset -2px 0 3px rgb(0 0 0 / 0.55);
      }

      .pin-hole::after {
        content: "";
        position: absolute;
        inset: -5px;
        border: 5px solid #26241f;
        border-radius: 50%;
      }

      .via {
        position: absolute;
        z-index: 3;
        right: 8px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #0d1d13;
        box-shadow: 0 0 0 1px var(--gold-mid);
      }

      .via-a {
        top: 34%;
      }

      .via-b {
        top: 66%;
      }

      .m-inner {
        flex: 1;
        height: 100%;
        border-radius: var(--radius-md);
        padding: 16px;
        background: linear-gradient(
          160deg,
          var(--stop-casing-1),
          var(--stop-casing-3)
        );
        box-shadow:
          0 0 0 1px rgb(50 45 35/0.3),
          -4px 5px 2px rgb(0 0 0/0.5),
          var(--sh-bevel-top);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .m-inner b {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .m-screen {
        flex: 1;
        border-radius: var(--radius-md);
        background: var(--stop-lcd-dark-0);
        box-shadow: var(--sh-hollow-top-deep);
        padding: 12px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: var(--color-on-lcd-dark);
      }

      /* LED "link" sur la home : verte quand connecté */
      .link-led {
        position: absolute;
        bottom: 18px;
        left: 22px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--color-ink-faint);
      }
      .link-led .d {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 32%, #798068, #494e3e 70%);
        box-shadow: inset 0 -2px 3px rgb(0 0 0/0.5);
        transition: 0.3s;
      }
      .rig.on .link-led .d {
        background: radial-gradient(
          circle at 40% 32%,
          var(--color-led-core),
          var(--color-led) 55%,
          var(--color-led-rim)
        );
        box-shadow: var(--sh-glow-led);
      }

      /* ---- image de référence RAM, flottante et déplaçable à la souris ---- */
      .ram-ref {
        position: fixed;
        top: 30%;
        left: 30px;
        z-index: 10;
        width: 40%;
        border-radius: 8px;
        box-shadow: 0 12px 30px rgb(0 0 0/0.6);
        cursor: grab;
        user-select: none;
      }
      .ram-ref.dragging {
        cursor: grabbing;
        opacity: 0.85;
      }
    </style>
  </head>

  <body>
    <div class="hint">
      le port femelle est gravé dans le flanc de la home — clique pour enficher
      le module
    </div>
    <button class="toggle" id="tg">BRANCHER / DÉBRANCHER</button>

    <div class="rig" id="rig">
      <div class="home-edge">
        <span class="home-label">DAWN-01</span>
        <div class="port" aria-hidden="true">
          <div class="port-back">
            <div class="port-contacts"></div>
          </div>
          <div class="port-front">
            <span class="port-code">CN-01</span>
            <span class="port-revision">REV.B</span>
            <span class="port-mark">DIMM_A1</span>
            <i class="port-rivet port-rivet-top"></i>
            <i class="port-rivet port-rivet-bottom"></i>
          </div>
          <div class="ram-clip">
            <span></span>
          </div>
        </div>
        <div class="link-led"><span class="d"></span>LINK</div>
      </div>

      <div class="module">
        <div class="plug" aria-hidden="true">
          <div class="plug-inner"></div>
          <div class="plug-traces"></div>
          <div class="circle-hole"></div>
          <div class="pin-hole"></div>
          <div class="via via-a"></div>
          <div class="via via-b"></div>
        </div>
        <div class="m-inner">
          <b>YT EXTRACTOR</b>
          <div class="m-screen">// module connected<br />~$ ready</div>
        </div>
      </div>
    </div>

    <img
      class="ram-ref"
      id="ramRef"
      src="/mockups/pci-express.png"
      alt="Référence RAM"
      draggable="false"
    />

    <script>
      const rig = document.getElementById("rig");
      document
        .getElementById("tg")
        .addEventListener("click", () => rig.classList.toggle("on"));

      // drag maison de l'image de référence (pas de drag-and-drop natif : trop de quirks)
      const ramRef = document.getElementById("ramRef");
      let offsetX = 0;
      let offsetY = 0;

      ramRef.addEventListener("pointerdown", (e) => {
        const rect = ramRef.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        ramRef.classList.add("dragging");
        ramRef.setPointerCapture(e.pointerId);
      });

      ramRef.addEventListener("pointermove", (e) => {
        if (!ramRef.classList.contains("dragging")) return;
        ramRef.style.left = `${e.clientX - offsetX}px`;
        ramRef.style.top = `${e.clientY - offsetY}px`;
        ramRef.style.right = "auto";
      });

      ramRef.addEventListener("pointerup", (e) => {
        ramRef.classList.remove("dragging");
        ramRef.releasePointerCapture(e.pointerId);
      });
    </script>
  </body>
</html>
